[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlikes"
version = "0.1.0"
description = "Search your X (Twitter) likes locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed to collect likes from the browser. Searching an already-built
# database, or importing an X data archive, needs nothing outside the stdlib.
browser = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
xlikes = "xlikes.cli:main"

[tool.setuptools.packages.find]
include = ["xlikes*"]
